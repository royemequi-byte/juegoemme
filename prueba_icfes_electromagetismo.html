<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba ICFES - Electromagnetismo</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 15px 50px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px; text-align: center; }
        .header h1 { font-size: 32px; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .header p { font-size: 16px; opacity: 0.95; }
        .content { padding: 40px; }

        .loading-state { text-align: center; padding: 80px 40px; }
        .loading-spinner { width: 50px; height: 50px; border: 4px solid #eee; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-state p { color: #888; font-size: 16px; }
        .error-state { text-align: center; padding: 80px 40px; }
        .error-state p { color: #e53935; font-size: 16px; }

        .question-block { margin-bottom: 40px; padding: 25px; background: #f8f9fa; border-left: 5px solid #667eea; border-radius: 8px; transition: all 0.3s ease; }
        .question-block:hover { box-shadow: 0 5px 15px rgba(102,126,234,0.1); }
        .question-number { display: inline-block; background: #667eea; color: white; padding: 6px 14px; border-radius: 20px; font-weight: bold; margin-bottom: 12px; font-size: 12px; }
        .question-text { font-size: 16px; color: #333; margin-bottom: 20px; font-weight: 500; line-height: 1.6; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { display: flex; align-items: center; padding: 14px 16px; background: white; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; }
        .option:hover { border-color: #667eea; background: #f0f4ff; transform: translateX(5px); }
        .option input[type="radio"] { margin-right: 14px; cursor: pointer; width: 18px; height: 18px; accent-color: #667eea; }
        .option span { flex: 1; cursor: pointer; font-size: 15px; color: #555; }

        .button-container { text-align: center; margin-top: 50px; padding-top: 30px; border-top: 2px solid #ddd; }
        button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 16px 50px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(102,126,234,0.3); }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
        button:active { transform: translateY(0); }

        .results { display: none; margin-top: 40px; padding: 35px; background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 100%); border-radius: 8px; border-left: 5px solid #4caf50; }
        .results.show { display: block; animation: slideIn 0.5s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .results h2 { color: #2e7d32; margin-bottom: 25px; font-size: 24px; }
        .result-item { margin-bottom: 15px; padding: 14px; background: white; border-radius: 6px; border-left: 4px solid #4caf50; font-size: 14px; color: #555; }
        .result-item.incorrect { border-left-color: #f44336; background: #ffebee; }
        .score { font-size: 28px; font-weight: bold; color: #2e7d32; margin-bottom: 20px; }
        .message { font-size: 18px; color: #333; margin-top: 20px; padding: 15px; background: white; border-radius: 8px; }
        .message.low { color: #f57c00; }

        @media (max-width: 600px) {
            .content { padding: 20px; }
            .header { padding: 25px 20px; }
            .header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Prueba ICFES</h1>
        <p>Electromagnetismo &#8212; Responde todas las preguntas y env&#237;a tu prueba</p>
    </div>
    <div class="content" id="content">
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <p>Cargando preguntas...</p>
        </div>
    </div>
</div>

<script>
    // ══════════════════════════════════════════════════════
    //  CONFIGURACIÓN FIREBASE — pegar aquí tu config
    // ══════════════════════════════════════════════════════
    const firebaseConfig = {
        apiKey:            "PEGAR_AQUI",
        authDomain:        "PEGAR_AQUI",
        projectId:         "PEGAR_AQUI",
        storageBucket:     "PEGAR_AQUI",
        messagingSenderId: "PEGAR_AQUI",
        appId:             "PEGAR_AQUI"
    };
    // ══════════════════════════════════════════════════════

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let preguntasData = [];

    async function cargarPreguntas() {
        try {
            const snapshot = await db.collection('preguntas').orderBy('orden', 'asc').get();
            preguntasData = [];
            snapshot.forEach(doc => preguntasData.push({ id: doc.id, ...doc.data() }));
            if (preguntasData.length === 0) {
                document.getElementById('content').innerHTML =
                    '<div class="error-state"><p>No hay preguntas disponibles aun. Consulta a tu docente.</p></div>';
                return;
            }
            renderQuiz();
        } catch(e) {
            document.getElementById('content').innerHTML =
                '<div class="error-state"><p>No se pudieron cargar las preguntas. Intenta de nuevo.</p></div>';
        }
    }

    function renderQuiz() {
        const total = preguntasData.length;
        let html = '<form id="quizForm">';
        preguntasData.forEach((p, idx) => {
            const n = idx + 1;
            html += '<div class="question-block">'
                + '<span class="question-number">Pregunta ' + n + ' de ' + total + '</span>'
                + '<p class="question-text">' + esc(p.pregunta) + '</p>'
                + '<div class="options">'
                + '<label class="option"><input type="radio" name="q' + n + '" value="a"><span>A) ' + esc(p.opcionA) + '</span></label>'
                + '<label class="option"><input type="radio" name="q' + n + '" value="b"><span>B) ' + esc(p.opcionB) + '</span></label>'
                + '<label class="option"><input type="radio" name="q' + n + '" value="c"><span>C) ' + esc(p.opcionC) + '</span></label>'
                + '<label class="option"><input type="radio" name="q' + n + '" value="d"><span>D) ' + esc(p.opcionD) + '</span></label>'
                + '</div></div>';
        });
        html += '<div class="button-container"><button type="button" onclick="calcularResultados()">Enviar Respuestas</button></div>'
              + '</form>'
              + '<div class="results" id="results">'
              + '<h2>Resultados de tu Prueba</h2>'
              + '<div class="score" id="score"></div>'
              + '<div id="resultDetails"></div>'
              + '<div class="message" id="message"></div>'
              + '</div>';
        document.getElementById('content').innerHTML = html;
    }

    function calcularResultados() {
        const total = preguntasData.length;
        let aciertos = 0;
        let detalles = '<div>';
        preguntasData.forEach((p, idx) => {
            const n = idx + 1;
            const sel = document.querySelector('input[name="q' + n + '"]:checked');
            if (!sel) {
                detalles += '<div class="result-item incorrect"><strong>Pregunta ' + n + ':</strong> No respondiste. Respuesta correcta: <strong>' + p.respuesta.toUpperCase() + '</strong></div>';
            } else if (sel.value === p.respuesta) {
                aciertos++;
                detalles += '<div class="result-item"><strong>Pregunta ' + n + ':</strong> Correcto</div>';
            } else {
                detalles += '<div class="result-item incorrect"><strong>Pregunta ' + n + ':</strong> Incorrecto. Respondiste ' + sel.value.toUpperCase() + ', la correcta es ' + p.respuesta.toUpperCase() + '</div>';
            }
        });
        detalles += '</div>';
        const pct = Math.round((aciertos / total) * 100);
        document.getElementById('score').textContent = aciertos + '/' + total + ' — ' + pct + '%';
        document.getElementById('resultDetails').innerHTML = detalles;
        const msg = document.getElementById('message');
        if (pct >= 90) { msg.textContent = 'Excelente! Dominaste el tema del electromagnetismo.'; msg.classList.remove('low'); }
        else if (pct >= 70) { msg.textContent = 'Muy bien! Tienes un buen conocimiento del tema.'; msg.classList.remove('low'); }
        else if (pct >= 50) { msg.textContent = 'Necesitas repasar algunos conceptos del electromagnetismo.'; msg.classList.add('low'); }
        else { msg.textContent = 'Te recomendamos estudiar mas sobre el electromagnetismo.'; msg.classList.add('low'); }
        document.getElementById('results').classList.add('show');
        document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function esc(t) {
        if (!t) return '';
        return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    cargarPreguntas();
</script>
</body>
</html>
